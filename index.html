<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17324D" />
    <meta name="description" content="Giáo trình tự học ngữ pháp TOEIC Reading Part 5–6–7 bằng tiếng Việt, dùng offline." />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>TOEIC Reading Grammar Academy</title>
    <script>
      try {
        var t = localStorage.getItem('tra-theme') || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (d) document.documentElement.classList.add('dark');
        var f = localStorage.getItem('tra-font');
        if (f) document.documentElement.style.setProperty('--content-size', f + 'px');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
